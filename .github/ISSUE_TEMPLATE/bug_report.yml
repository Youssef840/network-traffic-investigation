name: Bug report
description: Something is wrong with parsing, detection or reporting
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the console output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: NTI version
      placeholder: "nti --version"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS / Python version
      placeholder: "Windows 11 / Python 3.12"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach a real capture or any credentials / private IPs.
          required: true
