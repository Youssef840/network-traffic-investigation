name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests + coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: CLI smoke run (installed `nti` command)
        shell: bash
        run: |
          python tools/generate_sample_pcap.py -o samples/sample_incident.pcap
          nti samples/sample_incident.pcap -o ci-out --case-id CI-001 -q
          for f in report.pdf report.html stix.json results.json iocs.csv findings.csv; do
            test -s "ci-out/CI-001_$f" || { echo "missing $f"; exit 1; }
          done
      - name: Upload sample report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: ci-out/

  docker:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nti .
      - run: docker run --rm nti --version
