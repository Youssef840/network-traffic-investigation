name: Demo report (GitHub Pages)

# Regenerates the DEMO-001 report from the synthetic sample capture with the
# current code and publishes the interactive HTML dashboard on GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install .
      - name: Generate synthetic capture and analyse it
        run: |
          python tools/generate_sample_pcap.py -o samples/sample_incident.pcap
          nti samples/sample_incident.pcap -o site --case-id DEMO-001 --analyst "SOC Team" -q
      - name: Build page
        run: |
          cd site
          mv DEMO-001_report.html index.html
          BANNER='<div style="background:#3a2a14;color:#f0c27a;padding:10px 16px;font:14px/1.6 system-ui,sans-serif;border-bottom:1px solid #6b4f22">
          <b>Sample report</b> &mdash; generated by <a style="color:#ffd591" href="https://github.com/Youssef840/network-traffic-investigation">Network Traffic Investigation</a>
          from a <b>synthetic</b> capture (documentation IP ranges, fictitious domains). Not real traffic.
          Downloads: <a style="color:#ffd591" href="DEMO-001_report.pdf">PDF</a> &middot;
          <a style="color:#ffd591" href="DEMO-001_stix.json">STIX 2.1</a> &middot;
          <a style="color:#ffd591" href="DEMO-001_iocs.csv">IOCs CSV</a> &middot;
          <a style="color:#ffd591" href="DEMO-001_findings.csv">Findings CSV</a> &middot;
          <a style="color:#ffd591" href="DEMO-001_results.json">JSON</a></div>'
          python - "$BANNER" <<'PY'
          import sys, pathlib
          p = pathlib.Path("index.html")
          html = p.read_text(encoding="utf-8")
          assert "<body>" in html, "report layout changed: no <body> tag"
          p.write_text(html.replace("<body>", "<body>" + sys.argv[1], 1), encoding="utf-8")
          PY
          ls -la
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
