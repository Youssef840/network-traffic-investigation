[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-traffic-investigation"
dynamic = ["version"]
description = "PCAP forensics toolkit: DNS & TLS indicators, anomaly detection, IOC export and executive/tactical PDF + HTML reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Youssef Hussein" }]
requires-python = ">=3.10"
keywords = ["pcap", "forensics", "dfir", "network-security", "threat-hunting", "ioc", "scapy", "ja3", "stix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "reportlab>=4.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3"]

[project.scripts]
nti = "nti.cli:main"

[project.urls]
Homepage = "https://github.com/Youssef840/network-traffic-investigation"
Issues = "https://github.com/Youssef840/network-traffic-investigation/issues"

[tool.setuptools]
packages = ["nti"]

[tool.setuptools.dynamic]
version = { attr = "nti.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["nti"]
omit = ["nti/__main__.py"]
